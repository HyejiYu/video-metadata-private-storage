version: '3.8'

networks:
  elastic:

services:
  elasticsearch:
    image: hyejiyu/elasticsearch-fsp
    container_name: elasticsearch
    environment:
      - discovery.type=single-node # 단일 노드 모드 설정
      - bootstrap.memory_lock=true # 메모리 잠금 설정
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # JVM 메모리 설정 (필요에 따라 조정)
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "9200:9200" # Elasticsearch REST API 포트 매핑
      - "9300:9300" # Elasticsearch 노드 간 통신 포트 매핑
    volumes:
      - ./data/es:/usr/share/elasticsearch/data # 데이터 지속성을 위한 볼륨 설정
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - elastic

  kibana:
    image: hyejiyu/kibana-fsp
    container_name: kibana
    ports:
      - "5601:5601" # Kibana 포트 매핑
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTIC_USER}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    depends_on:
      - elasticsearch
    networks:
      - elastic

